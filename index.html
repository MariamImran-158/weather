<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <style>
    body {
  font-family: system-ui, sans-serif;
  background: #e8f1f8;
  color: #16324a;
  padding: 30px 16px;
}

.app {
  max-width: 420px;
  margin: 0 auto;
  text-align: center;
}

.search {
  display: flex;
  gap: 8px;
}

#city {
  flex: 1;
  font: inherit;
  font-size: 1.1rem;
  padding: 12px 14px;
  border: 2px solid #9bb8cf;
  border-radius: 10px;
}

button {
  font: inherit;
  font-size: 1.1rem;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #16324a;
  color: #fff;
  cursor: pointer;
}

#status {
  margin: 20px 0;
  min-height: 24px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}

.card h2 {
  margin: 0;
}

.country {
  color: #4b6a82;
  margin: 4px 0 12px;
}

.temp {
  font-size: 3.5rem;
  font-weight: 700;
}

.card p {
  margin: 6px 0;
  color: #4b6a82;
}
  </style>
</head>
<body>
  <div class="app">
    <h1>Weather App</h1>

    <div class="search">
      <input id="city" type="text" placeholder="Search city..." value="Karachi">
      <button id="btn">Search</button>
    </div>

    <div id="status"></div>

    <div class="card" id="card" hidden>
      <h2 id="name"></h2>
      <div class="country" id="country"></div>
      <div class="temp" id="temp"></div>
      <p id="condition"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
